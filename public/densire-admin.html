<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>DENSIRE — Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root{color-scheme:dark;--bg:#09090b;--panel:#18181b;--panel2:#27272a;--brand:#facc15;--green:#22c55e;--text:#fafafa;--muted:#a1a1aa}
    *{box-sizing:border-box} body{margin:0;font-family:"Plus Jakarta Sans",sans-serif;background:var(--bg);color:var(--text)} button,input,select,textarea{font:inherit}
    .shell{min-height:100vh;display:grid;grid-template-columns:240px 1fr}.sidebar{position:sticky;top:0;height:100vh;border-right:1px solid #27272a;padding:24px 16px;background:#0d0d10}
    .brand{font-weight:800;font-size:18px;margin-bottom:28px}.brand b{color:var(--brand)}
    .nav{display:flex;flex-direction:column;gap:6px}.nav button,.subnav button{border:0;color:#d4d4d8;background:transparent;text-align:left;border-radius:10px;padding:11px 12px;cursor:pointer}
    .nav button.active,.subnav button.active{background:var(--brand);color:#18181b;font-weight:800}.subnav{display:flex;flex-direction:column;margin:4px 0 8px 18px;border-left:1px solid #3f3f46;padding-left:8px}
    .subnav button{padding:7px 10px;font-size:12px}.main{min-width:0;padding:28px 32px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px}.top h1{font-size:24px;margin:0}.top button{border:1px solid #3f3f46;background:#18181b;color:#fff;border-radius:9px;padding:8px 12px;cursor:pointer}
    .view{display:none}.view.active{display:block}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.card{background:var(--panel);border:1px solid #27272a;border-radius:14px;padding:16px}.metric{font-size:28px;font-weight:800;color:var(--brand)}
    .filters{display:flex;gap:8px;margin:16px 0}.filters button{border:1px solid #3f3f46;background:var(--panel);color:#d4d4d8;border-radius:999px;padding:7px 11px;font-size:12px;cursor:pointer}.filters button.active{border-color:var(--brand);color:var(--brand)}
    .orders{display:grid;gap:12px}.order{background:var(--panel);border:1px solid #27272a;border-radius:14px;padding:15px}.order-head,.row,.item-row{display:flex;justify-content:space-between;gap:12px}.order-head{align-items:flex-start}.order small{color:var(--muted)}.order ul{border-block:1px solid #27272a;padding:10px 0 10px 18px;margin:12px 0}.order li{margin:4px 0;font-size:13px}
    select.status{background:#27272a;border:1px solid #3f3f46;color:var(--brand);border-radius:8px;padding:7px}.form{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{display:flex;flex-direction:column;gap:6px}.field.full{grid-column:1/-1}.field label{font-size:11px;font-weight:700;color:#d4d4d8}.field input,.field textarea,.field select{width:100%;border:1px solid #3f3f46;background:#27272a;color:#fff;border-radius:10px;padding:10px}.field textarea{resize:vertical}
    .primary{border:0;background:var(--brand);color:#18181b;border-radius:10px;padding:10px 14px;font-weight:800;cursor:pointer}.danger{border:0;background:#7f1d1d;color:#fecaca;border-radius:8px;padding:7px 9px;font-size:11px;cursor:pointer}.list{display:grid;gap:8px;margin-top:12px}.list-item{display:grid;grid-template-columns:1fr 100px 110px 78px 70px;align-items:center;gap:8px;background:#18181b;border:1px solid #27272a;border-radius:10px;padding:10px}.list-item input{min-width:0;border:1px solid #3f3f46;background:#27272a;color:#fff;border-radius:8px;padding:7px}.stock-toggle{cursor:pointer;border:1px solid #3f3f46;background:#27272a;color:#d4d4d8;border-radius:8px;padding:7px;font-size:11px}.stock-toggle.in{color:#86efac}.stock-toggle.out{color:#fca5a5}
    .deal-items{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.deal-item{display:flex;align-items:center;gap:9px;background:#27272a;border:1px solid #3f3f46;border-radius:10px;padding:9px;font-size:12px}.deal-item input{accent-color:var(--brand)}
    .edit-item{display:flex;align-items:center;gap:12px;background:var(--panel);border:1px solid #27272a;border-radius:10px;padding:10px}.edit-item img{width:56px;height:56px;object-fit:cover;border-radius:8px;background:#27272a}.edit-item-info{flex:1;min-width:0}.edit-item-info small{color:var(--muted)}.edit-placeholder{width:56px;height:56px;border-radius:8px;background:#27272a}.edit-preview{width:100px;height:100px;object-fit:cover;border-radius:10px;background:#27272a}.secondary{border:1px solid #3f3f46;background:#18181b;color:#fff;border-radius:10px;padding:10px 14px;cursor:pointer}
    .login{position:fixed;inset:0;display:grid;place-items:center;background:var(--bg);z-index:20}.login.hidden{display:none}.login-card{width:min(360px,calc(100% - 32px));background:#18181b;border:1px solid #3f3f46;border-radius:18px;padding:24px}.login-card h2{margin-top:0}.login-card input{width:100%;border:1px solid #3f3f46;background:#27272a;color:#fff;border-radius:10px;padding:12px;margin:12px 0}.login-card .primary{width:100%}.error{color:#fca5a5;font-size:12px;min-height:18px}.muted{color:var(--muted);font-size:12px}
    @media(max-width:900px){.shell{grid-template-columns:1fr}.sidebar{height:auto;position:relative}.nav{display:grid;grid-template-columns:repeat(2,1fr)}.subnav{grid-column:1/-1}.main{padding:20px 16px}.grid{grid-template-columns:repeat(2,1fr)}.form{grid-template-columns:1fr}.field.full{grid-column:auto}.list-item{grid-template-columns:1fr 90px}.deal-items{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <div id="login" class="login"><form id="loginForm" class="login-card"><h2>Admin sign in</h2><input id="password" type="password" autocomplete="current-password" placeholder="Admin password" required /><div id="loginError" class="error"></div><button class="primary" type="submit">Sign in</button></form></div>
  <div class="shell">
    <aside class="sidebar"><div class="brand"><b>DENSIRE</b> ADMIN</div><nav class="nav">
      <button class="active" data-view="orders" onclick="showView('orders')">Orders</button>
      <button data-view="menu" onclick="showView('menu')">Menu</button>
      <div id="menuSubnav" class="subnav"><button data-subview="category" onclick="showMenu('category')">Add Category</button><button data-subview="deal" onclick="showMenu('deal')">Add Deal</button><button data-subview="item" onclick="showMenu('item')">Add Item</button><button data-subview="edit" onclick="showMenu('edit')">Edit Items</button></div>
      <button data-view="stock" onclick="showView('stock')">Stock</button>
      <button data-view="settings" onclick="showView('settings')">Settings</button>
    </nav></aside>
    <main class="main"><header class="top"><h1 id="pageTitle">Orders</h1><button onclick="signOut()">Sign out</button></header>
      <section id="ordersView" class="view active"><div class="grid">
        <div class="card"><small>Incoming / New</small><div id="metricNew" class="metric">0</div></div><div class="card"><small>Accepted / Preparing</small><div id="metricPreparing" class="metric">0</div></div><div class="card"><small>Ready</small><div id="metricReady" class="metric">0</div></div><div class="card"><small>Completed</small><div id="metricDone" class="metric">0</div></div>
      </div><div class="filters" id="orderFilters"></div><div id="ordersNotice" class="muted" role="status"></div><div id="ordersError" class="error" role="alert"></div><div id="ordersList" class="orders"></div></section>
      <section id="menuView" class="view"><div id="categoryPanel" class="card"><h3>Add Category</h3><div class="row"><input id="categoryName" placeholder="Category name" /><button class="primary" onclick="addCategory()">Add category</button></div><div id="categoryList" class="list"></div></div>
        <div id="dealPanel" class="card" hidden><h3>Add Deal</h3><div class="form"><div class="field full"><label>Deal name</label><input id="dealName" placeholder="e.g. Family Feast" /></div><div class="field full"><label>Select existing menu items</label><div id="dealItems" class="deal-items"></div></div><div class="field full"><label>Deal description</label><textarea id="dealDesc" rows="2"></textarea></div><div class="field"><label>Deal price (Rs.)</label><input id="dealPrice" type="number" min="1" /></div><div class="field"><label>Photo URL</label><input id="dealImage" type="url" /></div><div class="field"><button class="primary" onclick="addDeal()">Create deal</button></div></div></div>
        <div id="itemPanel" class="card" hidden><h3>Add Item</h3><div class="form"><div class="field"><label>Name</label><input id="itemName" /></div><div class="field"><label>Category</label><select id="itemCategory"></select></div><div class="field"><label>Price (Rs.)</label><input id="itemPrice" type="number" min="1" /></div><div class="field"><label>Photo URL</label><input id="itemImage" type="url" /></div><div class="field full"><label>Description</label><textarea id="itemDesc" rows="2"></textarea></div><div class="field full"><button class="primary" onclick="addItem()">Add item</button></div></div></div>
        <div id="editPanel" class="card" hidden><h3>Edit Existing Menu Items &amp; Deals</h3><div id="editItemsList" class="list"></div><div id="editForm" class="card" hidden><h3 id="editTitle">Edit item</h3><div class="form"><div class="field"><label>Name</label><input id="editName" /></div><div class="field"><label>Category</label><input id="editCategory" /></div><div class="field" id="editBasePriceField"><label>Price (Rs.)</label><input id="editPrice" type="number" min="0" /></div><div class="field full" id="editSizePricesField" hidden><label>Size prices (Rs.)</label><div id="editSizePrices" class="form"></div></div><div class="field"><label>Photo URL</label><input id="editImage" type="url" oninput="updateEditPreview()" /></div><div class="field full"><img id="editImagePreview" class="edit-preview" alt="Menu item photo preview" hidden /></div><div class="field full"><label>Description</label><textarea id="editDesc" rows="2"></textarea></div><div class="field full row"><button class="primary" onclick="saveItemEdits()">Save changes</button><button class="secondary" onclick="cancelItemEdit()">Cancel</button></div></div></div></div>
      </section>
      <section id="stockView" class="view"><div class="card"><h3>Current stock</h3><div id="stockList" class="list"></div></div></section>
      <section id="settingsView" class="view"><div class="card form"><div class="field"><label>Restaurant name</label><input id="storeName" /></div><div class="field"><label>Delivery fee (Rs.)</label><input id="deliveryFee" type="number" /></div><div class="field"><label>Free delivery minimum (Rs.)</label><input id="freeMin" type="number" /></div><div class="field"><label>Dine-in tables</label><input id="tables" /></div><div class="field"><label>JazzCash account</label><input id="jazzCash" /></div><div class="field"><label>Easypaisa account</label><input id="easypaisa" /></div><div class="field full"><button class="primary" onclick="saveSettings()">Save settings</button></div></div></section>
    </main>
  </div>
  <script>
    const MENU_KEY='densire_hbd_menu_v4',CONFIG_KEY='densire_hbd_config_v4',ORDERS_KEY='densire_hbd_orders_v1';
    const defaultConfig={storeName:'DENSIRE HAROONABAD',deliveryFee:80,freeDeliveryMin:500,availableTables:['1','2','3','4','5','6','7','8'],jazzCashAccount:'',easypaisaAccount:''};
    let menu=load(MENU_KEY,[]),config=load(CONFIG_KEY,defaultConfig),orders=[];
    let orderFilter='All';
    let orderRefreshTimer=null;
    let editingItemId=null;
    function load(key,fallback){try{const v=localStorage.getItem(key);if(v){const p=JSON.parse(v);if(Array.isArray(fallback)?Array.isArray(p):p&&typeof p==='object')return p}}catch(e){console.warn(e)}return Array.isArray(fallback)?[]:{...fallback}}
    function save(key,value){localStorage.setItem(key,JSON.stringify(value))}
    function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
    function canUseLocalOrderFallback(){return location.hostname==='localhost'||location.hostname==='127.0.0.1'}
    async function fetchOrders(){if(canUseLocalOrderFallback()){orders=load(ORDERS_KEY,[]);document.getElementById('ordersNotice').textContent='Local test mode: orders sync only between tabs in this browser.';document.getElementById('ordersError').textContent='';renderOrders();return}const r=await fetch('/api/orders',{cache:'no-store',credentials:'same-origin'});const d=await r.json();if(!r.ok)throw new Error(d.error||'Could not load orders');if(!Array.isArray(d.orders))throw new Error('Order service returned invalid data');orders=d.orders;document.getElementById('ordersNotice').textContent='';document.getElementById('ordersError').textContent='';renderOrders()}
    function showOrdersError(error){console.error('Order refresh failed:',error);document.getElementById('ordersError').textContent=error instanceof Error?error.message:'Orders could not be loaded'}
    function startOrderPolling(){if(orderRefreshTimer!==null)clearInterval(orderRefreshTimer);fetchOrders().catch(showOrdersError);orderRefreshTimer=window.setInterval(()=>fetchOrders().catch(showOrdersError),10000)}
    async function checkAuth(){try{const r=await fetch('/api/admin/session',{cache:'no-store',credentials:'same-origin'});const d=await r.json();if(r.ok&&d.authenticated){document.getElementById('login').classList.add('hidden');renderAll();startOrderPolling();return}if(r.status!==401)document.getElementById('loginError').textContent=d.error||'Could not check admin sign-in'}catch(e){console.error(e);document.getElementById('loginError').textContent='Could not reach sign-in service'}document.getElementById('login').classList.remove('hidden')}
    document.getElementById('loginForm').addEventListener('submit',async e=>{
      e.preventDefault();const input=document.getElementById('password');const error=document.getElementById('loginError');error.textContent='';
      try{const r=await fetch('/api/admin/session',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:input.value})});const d=await r.json();if(!r.ok){error.textContent=d.error||'Sign in failed';return}document.getElementById('login').classList.add('hidden');input.value='';renderAll();startOrderPolling()}catch(err){console.error(err);error.textContent='Could not reach sign-in service'}
    });
    async function signOut(){if(orderRefreshTimer!==null)clearInterval(orderRefreshTimer);orderRefreshTimer=null;await fetch('/api/admin/session',{method:'DELETE',credentials:'same-origin'});document.getElementById('login').classList.remove('hidden')}
    function showView(name){document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));document.getElementById(name+'View').classList.add('active');document.querySelectorAll('.nav>button').forEach(b=>b.classList.toggle('active',b.dataset.view===name));document.getElementById('pageTitle').textContent=name[0].toUpperCase()+name.slice(1);if(name==='menu')showMenu('category');if(name==='stock')renderStock();if(name==='settings')renderSettings()}
    function showMenu(name){document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));document.getElementById('menuView').classList.add('active');document.querySelectorAll('.nav>button').forEach(b=>b.classList.toggle('active',b.dataset.view==='menu'));document.getElementById('pageTitle').textContent='Menu';['category','deal','item','edit'].forEach(n=>document.getElementById(n+'Panel').hidden=n!==name);document.querySelectorAll('.subnav button').forEach(b=>b.classList.toggle('active',b.dataset.subview===name));if(name==='deal')renderDealItems();if(name==='item')renderItemForm();if(name==='edit')renderEditItems()}
    function renderAll(){renderOrders();renderCategories();renderItemForm();renderDealItems();renderEditItems();renderStock();renderSettings()}
    function renderOrders(){const statuses=['New','Preparing','Ready','Completed','Cancelled'];document.getElementById('metricNew').textContent=orders.filter(o=>o.status==='New').length;document.getElementById('metricPreparing').textContent=orders.filter(o=>o.status==='Preparing').length;document.getElementById('metricReady').textContent=orders.filter(o=>o.status==='Ready').length;document.getElementById('metricDone').textContent=orders.filter(o=>o.status==='Completed').length;
      document.getElementById('orderFilters').innerHTML=['All',...statuses].map(s=>`<button class="${orderFilter===s?'active':''}" onclick="setOrderFilter('${s}')">${s==='New'?'Incoming':s}</button>`).join('');
      const visible=orderFilter==='All'?orders:orders.filter(o=>o.status===orderFilter);document.getElementById('ordersList').innerHTML=visible.length?visible.map(o=>`<article class="order"><div class="order-head"><div><strong>${esc(o.id)}</strong><br><small>${esc(o.orderType||'delivery')} · ${esc(o.customer?.name||'Customer')} · ${esc(o.customer?.phone||'')}</small></div><select class="status" onchange="setOrderStatus('${esc(o.id)}',this.value)">${statuses.map(s=>`<option ${o.status===s?'selected':''}>${s}</option>`).join('')}</select></div><ul>${(o.items||[]).map(i=>`<li>${esc(i.qty)} × ${esc(i.name)}${i.size?' ('+esc(i.size)+')':''} — Rs. ${esc(Number(i.unitPrice)*Number(i.qty))}</li>`).join('')}</ul><div class="row"><small>${esc(o.paymentMethod)} · ${esc(o.customer?.address||'')}</small><strong>Rs. ${esc(o.grandTotal)}</strong></div></article>`).join(''):'<div class="card">No orders in this view.</div>';
    }
    function setOrderFilter(v){orderFilter=v;renderOrders()}
    async function setOrderStatus(id,status){const order=orders.find(x=>x.id===id);if(!order)return;if(canUseLocalOrderFallback()){order.status=status;save(ORDERS_KEY,orders);document.getElementById('ordersError').textContent='';renderOrders();return}try{const r=await fetch('/api/orders',{method:'PATCH',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify({id,status})});const d=await r.json();if(!r.ok)throw new Error(d.error||'Could not update order');order.status=status;document.getElementById('ordersError').textContent='';renderOrders()}catch(error){showOrdersError(error);renderOrders()}}
    function categories(){const configured=Array.isArray(config.categories)?config.categories.map(c=>typeof c==='string'?c.trim():c&&typeof c==='object'?(typeof c.id==='string'&&c.id.trim()||typeof c.title==='string'&&c.title.trim()||''):'').filter(Boolean):[];const fromMenu=menu.map(i=>typeof i.category==='string'?i.category.trim():'').filter(Boolean);const names=[...new Set([...configured,...fromMenu])];return names.length?names:['Den-Deals','Den-Burgers','Grill Burgers','Den-Pizza','Den-Rolls','Den-Snacks','Drinks & Desserts']}
    function renderCategories(){document.getElementById('categoryList').innerHTML=categories().map(c=>`<div class="row card"><strong>${esc(c)}</strong><button class="danger" onclick="deleteCategory('${esc(c)}')">Delete</button></div>`).join('')}
    function addCategory(){const i=document.getElementById('categoryName'),name=i.value.trim();if(!name)return alert('Enter a category name');if(categories().some(c=>c.toLowerCase()===name.toLowerCase()))return alert('Category already exists');if(!Array.isArray(config.categories))config.categories=[];categories().forEach(category=>{const exists=config.categories.some(c=>typeof c==='string'?c===category:c&&typeof c==='object'&&(c.id===category||c.title===category));if(!exists)config.categories.push({id:category,title:category})});config.categories.push({id:name,title:name,subtitle:'Freshly prepared to order'});save(CONFIG_KEY,config);i.value='';renderCategories();renderItemForm();alert('Category added')}
    function deleteCategory(name){if(categories().length<=1)return alert('Keep at least one category');if(menu.some(i=>i.category===name))return alert('Remove or move items in this category first');if(config.categories)config.categories=config.categories.filter(c=>typeof c==='string'?c!==name:!c||c.id!==name&&c.title!==name);save(CONFIG_KEY,config);renderCategories();renderItemForm()}
    function renderItemForm(){const s=document.getElementById('itemCategory');s.innerHTML=categories().map(c=>`<option>${esc(c)}</option>`).join('')}
    function addItem(){const name=document.getElementById('itemName').value.trim(),price=Number(document.getElementById('itemPrice').value);if(!name||price<=0)return alert('Enter item name and price');menu.unshift({id:Date.now(),category:document.getElementById('itemCategory').value,name,price,desc:document.getElementById('itemDesc').value.trim()||'Freshly prepared at DENSIRE.',image:document.getElementById('itemImage').value.trim()||'',available:true});save(MENU_KEY,menu);document.getElementById('itemName').value='';document.getElementById('itemPrice').value='';document.getElementById('itemDesc').value='';document.getElementById('itemImage').value='';renderStock();renderDealItems();renderEditItems();alert('Item added')}
    function renderDealItems(){document.getElementById('dealItems').innerHTML=menu.filter(i=>!i.isDeal&&!/deal/i.test(i.category||'')).map(i=>`<label class="deal-item"><input type="checkbox" value="${i.id}" /> <span><strong>${esc(i.name)}</strong><br>Rs. ${esc(i.price)}</span></label>`).join('')}
    function addDeal(){const name=document.getElementById('dealName').value.trim(),price=Number(document.getElementById('dealPrice').value),selected=[...document.querySelectorAll('#dealItems input:checked')].map(x=>Number(x.value));if(!name||price<=0||!selected.length)return alert('Enter deal name, price, and select at least one item');const chosen=menu.filter(i=>selected.includes(Number(i.id)));menu.unshift({id:Date.now(),category:'Den-Deals',name,price,desc:document.getElementById('dealDesc').value.trim()||chosen.map(i=>i.name).join(' + '),image:document.getElementById('dealImage').value.trim()||chosen.find(i=>i.image)?.image||'',available:true,isDeal:true,dealItems:selected});save(MENU_KEY,menu);document.getElementById('dealName').value='';document.getElementById('dealPrice').value='';document.getElementById('dealDesc').value='';document.getElementById('dealImage').value='';renderDealItems();renderStock();renderEditItems();alert('Deal created')}
    function renderEditItems(){const list=document.getElementById('editItemsList');if(!list)return;list.innerHTML=menu.map(i=>`<div class="edit-item">${i.image?`<img src="${esc(i.image)}" alt="${esc(i.name)}" />`:'<div class="edit-placeholder"></div>'}<div class="edit-item-info"><strong>${esc(i.name)}</strong><br><small>${esc(i.category||'Uncategorized')} · ${i.sizes&&Object.keys(i.sizes).length?'From ':''}Rs. ${esc(i.price)}</small></div><button class="primary" onclick="editItem(${Number(i.id)})">Edit</button></div>`).join('')||'<div class="card">No menu items to edit.</div>'}
    function editItem(id){const item=menu.find(i=>String(i.id)===String(id));if(!item)return;editingItemId=item.id;document.getElementById('editTitle').textContent=item.isDeal||item.dealItems||/deal/i.test(item.category||'')?'Edit deal':'Edit menu item';document.getElementById('editName').value=item.name||'';document.getElementById('editCategory').value=item.category||'';document.getElementById('editPrice').value=item.price??'';const sizeEntries=item.sizes&&typeof item.sizes==='object'&&!Array.isArray(item.sizes)?Object.entries(item.sizes):[];document.getElementById('editBasePriceField').hidden=sizeEntries.length>0;document.getElementById('editSizePricesField').hidden=sizeEntries.length===0;document.getElementById('editSizePrices').innerHTML=sizeEntries.map(([size,price],index)=>`<div class="field"><label for="editSizePrice${index}">${esc(size)} size (Rs.)</label><input id="editSizePrice${index}" type="number" min="0" data-size-price="${esc(size)}" value="${esc(price)}" /></div>`).join('');document.getElementById('editImage').value=item.image||'';document.getElementById('editDesc').value=item.desc||'';document.getElementById('editForm').hidden=false;updateEditPreview()}
    function updateEditPreview(){const preview=document.getElementById('editImagePreview'),value=document.getElementById('editImage').value.trim();if(!value){preview.hidden=true;preview.removeAttribute('src');return}try{const url=new URL(value);if(!['http:','https:'].includes(url.protocol))throw new Error('Unsupported photo URL');preview.src=url.href;preview.hidden=false}catch{preview.hidden=true;preview.removeAttribute('src')}}
    function cancelItemEdit(){editingItemId=null;document.getElementById('editForm').hidden=true}
    function saveItemEdits(){const item=menu.find(i=>String(i.id)===String(editingItemId));if(!item)return;const name=document.getElementById('editName').value.trim(),category=document.getElementById('editCategory').value.trim(),priceValue=document.getElementById('editPrice').value.trim(),price=Number(priceValue),sizeInputs=[...document.querySelectorAll('#editSizePrices input[data-size-price]')],sizes={};for(const input of sizeInputs){const size=input.dataset.sizePrice,value=input.value.trim(),sizePrice=Number(value);if(!size||!value||!Number.isFinite(sizePrice)||sizePrice<0)return alert('Enter a valid price for every size');sizes[size]=sizePrice}if(!name||!category||(!sizeInputs.length&&(!priceValue||!Number.isFinite(price)||price<0)))return alert('Enter a name, category, and valid price');const image=document.getElementById('editImage').value.trim();if(image){try{const url=new URL(image);if(!['http:','https:'].includes(url.protocol))throw new Error('Unsupported photo URL')}catch{return alert('Enter a valid HTTP or HTTPS photo URL')}}item.name=name;item.category=category;if(sizeInputs.length){item.sizes=sizes;item.price=sizes[sizeInputs[0].dataset.sizePrice]}else item.price=price;item.image=image;item.desc=document.getElementById('editDesc').value.trim();save(MENU_KEY,menu);cancelItemEdit();renderEditItems();renderStock();renderDealItems();alert('Changes saved')}
    function renderStock(){document.getElementById('stockList').innerHTML=menu.map(i=>`<div class="list-item"><strong>${esc(i.name)}</strong>${i.sizes&&typeof i.sizes==='object'&&Object.keys(i.sizes).length?`<span class="muted" title="${esc(Object.entries(i.sizes).map(([size,price])=>`${size}: Rs. ${price}`).join(', '))}">Varies by size</span>`:`<input type="number" min="0" value="${esc(i.price)}" onchange="setPrice(${i.id},this.value)" />`}<span>${esc(i.category||'Uncategorized')}</span><button class="stock-toggle ${i.available===false?'out':'in'}" onclick="toggleStock(${i.id})">${i.available===false?'Out of stock':'In stock'}</button><button class="danger" onclick="deleteItem(${i.id})">Delete</button></div>`).join('')}
    function setPrice(id,value){const i=menu.find(x=>x.id===id);if(!i)return;i.price=Math.max(0,Number(value)||0);save(MENU_KEY,menu);renderStock();renderEditItems()}
    function toggleStock(id){const i=menu.find(x=>x.id===id);if(!i)return;i.available=i.available===false;save(MENU_KEY,menu);renderStock()}
    function deleteItem(id){if(!confirm('Delete this menu item?'))return;menu=menu.filter(i=>i.id!==id);save(MENU_KEY,menu);renderStock();renderDealItems();renderEditItems()}
    function renderSettings(){document.getElementById('storeName').value=config.storeName||defaultConfig.storeName;document.getElementById('deliveryFee').value=config.deliveryFee??defaultConfig.deliveryFee;document.getElementById('freeMin').value=config.freeDeliveryMin??defaultConfig.freeDeliveryMin;document.getElementById('tables').value=(config.availableTables||defaultConfig.availableTables).join(', ');document.getElementById('jazzCash').value=config.jazzCashAccount||'';document.getElementById('easypaisa').value=config.easypaisaAccount||''}
    function saveSettings(){config.storeName=document.getElementById('storeName').value.trim()||defaultConfig.storeName;config.deliveryFee=Math.max(0,Number(document.getElementById('deliveryFee').value)||0);config.freeDeliveryMin=Math.max(0,Number(document.getElementById('freeMin').value)||0);config.availableTables=[...new Set(document.getElementById('tables').value.split(',').map(v=>v.trim()).filter(Boolean))];config.jazzCashAccount=document.getElementById('jazzCash').value.trim();config.easypaisaAccount=document.getElementById('easypaisa').value.trim();save(CONFIG_KEY,config);alert('Settings saved')}
    window.addEventListener('storage',e=>{if(e.key===MENU_KEY){menu=load(MENU_KEY,[]);renderAll()}if(e.key===ORDERS_KEY&&canUseLocalOrderFallback()){orders=load(ORDERS_KEY,[]);renderOrders()}if(e.key===CONFIG_KEY){config=load(CONFIG_KEY,defaultConfig);renderAll()}});
    checkAuth();
  </script>
</body>
</html>
